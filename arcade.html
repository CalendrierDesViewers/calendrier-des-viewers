);const rand=a=>a[Math.floor(Math.random()*a.length)];$('start').onclick=()=>{reset();$('start').disabled=true;let t=token,score=0;const colors=['#bd4358','#4ca77b','#568dd1','#d8b34e','#a16bd1'];function tile(v,f){let b=btn('',f);b.style.background=v;b.style.minHeight='38px';b.setAttribute('aria-label',v);return b}function grid(n){board.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))'}function status(s){$('status').textContent=s}if(game===0){let cells=Array.from({length:48},(_,i)=>i<32?rand(colors):null),shot=rand(colors),moves=25;grid(8);function draw(){board.replaceChildren();status('Orbe suivante : '+['rouge','verte','bleue','dorée','violette'][colors.indexOf(shot)]+' • '+moves+' tirs • '+score+' points');cells.forEach((v,i)=>{let b=tile(v||'#142820',()=>{if(v)return;let col=i%8,j=col;while(j<48&&cells[j])j+=8;if(j>=48)return;cells[j]=shot;let seen=new Set([j]),q=[j];while(q.length){let k=q.pop();for(let l of [k-8,k+8,k%8?k-1:-1,k%8<7?k+1:-1])if(l>=0&&l<48&&!seen.has(l)&&cells[l]===shot){seen.add(l);q.push(l)}}if(seen.size>=3){seen.forEach(k=>cells[k]=null);score+=seen.size*5}shot=rand(colors);if(--moves<=0||score>=100)return finish(score);draw()});b.disabled=!!v});}draw()}else if(game===1){board.style.gridTemplateColumns='1fr';let scene=document.createElement('div');scene.style.cssText='position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:12px;background:linear-gradient(#172b49,#68869b 55%,#e2e9ed 56%)';scene.innerHTML='<svg viewBox="0 0 320 400" style="position:absolute;width:100%;height:100%"><circle cx="250" cy="50" r="27" fill="#f8dfad"/><path d="M0 200L80 55 160 200 230 80 320 200" fill="#b5c8d5"/><path d="M0 245Q160 210 320 245V400H0" fill="#e7eef2"/>'+[20,125,225].map((x,i)=>'<g transform="translate('+x+' '+(140+i%2*45)+')"><rect x="0" y="50" width="75" height="90" fill="#68514b"/><path d="M-8 55L37 0 83 55Z" fill="#eaf2f6"/><rect x="12" y="70" width="16" height="23" fill="#ffd37a"/><rect x="48" y="70" width="16" height="23" fill="#ffd
