<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade de Noël</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#55312d,#102820 70%);color:#f6e4bd;font:17px Georgia,serif;text-align:center;min-height:100vh}main{max-width:700px;margin:auto;padding:20px}section{background:#172c25;border:3px double #c9a35e;border-radius:16px;padding:18px;margin:16px 0}button,a{color:#ffe2a0}button{font:inherit;background:#344a38;border:1px solid #c9a35e;border-radius:9px;padding:12px;margin:4px;cursor:pointer}button:disabled{opacity:.5}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:relative}#board button{min-height:54px}h1,h2{color:#e9c77e}#board.target{display:block;height:240px;background:#112018}#board.target button{position:absolute}small{color:#d4c3a0}</style><main><a id="back" href="guilde.html">← Retour à la Guilde</a><h1>La salle d’arcade de Noël</h1><p>Six épreuves pour remplir ta bourse.</p><p id="balance"></p><section><div id="menu"></div></section><section><h2 id="title">Choisis une épreuve</h2><p id="status" aria-live="polite"></p><div id="board"></div><button id="start" hidden>Jouer</button></section><small>500 pièces maximum par jour. Récompenses locales, hors classement.</small></main><script>
const $=id=>document.getElementById(id),board=$('board'),test=new URLSearchParams(location.search).get('test')==='1',p=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),n=k=>Number(p.find(x=>x.type===k).value),date=n('year')*10000+n('month')*100+n('day'),active=date>=20261201&&date<=20261225;let demo=0,used=0,game=0,token=0,timer;const names=['La livraison de Noël','L’œuf du dragon','Le tir à l’arc','L’atelier de l’alchimiste','Les objets perdus','Les dés de la taverne'],caps=[100,150,100,150,200,100];function read(){try{return JSON.parse(localStorage.getItem('guilde2026')||'{}')}catch{return {}}}function balance(){let d=read();$('balance').textContent=test?demo+' pièces fictives gagnées':(d.coins||0)+' pièces • '+(d.arcade?.[date]||0)+'/500 gagnées aujourd’hui'}if(test)$('back').href+='?test=1';function reset(){token++;clearTimeout(timer);board.replaceChildren();board.className='';$('start').hidden=false;$('start').disabled=false}function finish(s){reset();let d=read(),earned=0;s=Math.min(caps[game],Math.max(0,s));if(test){earned=Math.min(s,500-used);used+=earned;demo+=earned}else if(active){d.arcade??={};earned=Math.min(s,Math.max(0,500-(d.arcade[date]||0)));d.arcade[date]=(d.arcade[date]||0)+earned;d.coins=(d.coins||0)+earned;try{localStorage.setItem('guilde2026',JSON.stringify(d))}catch{earned=0}}$('status').textContent='Partie terminée : +'+earned+' pièces'+(test?' fictives':'');balance();$('start').textContent='Rejouer'}function btn(t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;board.append(b);return b}function choose(i){reset();game=i;$('title').textContent=names[i];$('status').textContent=active||test?'Prêt à jouer ?':'Ouverture le 1er décembre';$('start').disabled=!active&&!test;$('start').textContent='Jouer'}names.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(i);$('menu').append(b)});const rand=a=>a[Math.floor(Math.random()*a.length)];$('start').onclick=()=>{reset();$('start').disabled=true;let t=token,score=0,round=0;function next(){if(t!==token)return;if(round++===10)return finish(score);board.replaceChildren();let target,options;if(game===0){target=rand(['Sapin','Étoile','Lune']);options=['Sapin','Étoile','Lune'];$('status').textContent='Livre le cadeau à la maison : '+target}else if(game===1){let a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12);target=String(a+b);options=[target,String(a+b+1),String(a+b-1)];$('status').textContent='Rune du dragon : '+a+' + '+b+' = ?'}else if(game===3){let recipes=[['Potion de givre','Glace + Menthe'],['Potion de feu','Braise + Cannelle'],['Potion de forêt','Mousse + Sapin']];let q=rand(recipes);target=q[1];options=recipes.map(x=>x[1]);$('status').textContent=q[0]+' : '+target}else if(game===4){target=rand(['Clé','Cloche','Cristal']);options=Array(11).fill('Flocon');options.push(target);$('status').textContent='Retrouve : '+target}else{let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);target=String(a+b);options=[target,String(a+b+2),String(a+b-1)];$('status').textContent='Additionne les dés : '+a+' et '+b}options.sort(()=>Math.random()-.5).forEach(v=>btn(v,()=>{if(v===target)score+=caps[game]/10;next()}))}if(game===2){board.className='target';let end=Date.now()+20000;function spawn(){if(t!==token)return;board.replaceChildren();let b=btn('◎',()=>{score+=5;spawn()});b.style.left=Math.random()*75+'%';b.style.top=Math.random()*70+'%';$('status').textContent='Touche la cible ! '+score+' points'}spawn();timer=setTimeout(()=>{if(t===token)finish(score)},20000)}else next()};balance();</script></html>
