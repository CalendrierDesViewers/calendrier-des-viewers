<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Guilde enchantée</title><style> *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#245443,#071c16 75%);color:#f5e8c6;font:17px Georgia,serif;min-height:100vh;text-align:center}main{max-width:700px;margin:auto;padding:24px 14px}section{border:1px solid #d6b36b;border-radius:22px;padding:20px;margin:18px 0;background:#102c24;box-shadow:0 0 24px #d6b36b33}h1{font-size:36px;color:#eac77b}button,a{color:#ffe4a1}button{background:#254b38;border:1px solid #d6b36b;border-radius:12px;padding:12px;font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:220px;position:relative}#board button{min-height:58px;font-size:25px}#board.arcade{display:block;height:270px;overflow:hidden;background:#091e18;border-radius:12px}#board.arcade button{position:absolute;min-height:44px;padding:8px}#days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}small{color:#d8c9a6}#spark{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffe7a0 1px,transparent 3px),radial-gradient(circle,#fff4cf 1px,transparent 3px);background-size:113px 137px,173px 97px;opacity:.22;animation:glow 4s infinite alternate}@keyframes glow{to{opacity:.65}}@media(prefers-reduced-motion:reduce){#spark{animation:none}}#board.letters{gap:3px;min-height:0}#board.letters button{min-width:0;min-height:22px;padding:0;font-size:clamp(9px,2.5vw,16px)}#board.letters button:disabled{opacity:1}select{font:inherit;background:#254b38;color:#ffe4a1;border:1px solid #d6b36b;padding:9px;border-radius:8px;max-width:100%}#board:empty{min-height:0}#board.memory button{min-width:0;padding:0;min-height:0;aspect-ratio:1;font-size:clamp(18px,5vw,34px)}#board.memory button:disabled{opacity:.75;background:#80652b} input{font:inherit;background:#254b38;color:#ffe4a1;border:1px solid #d6b36b;border-radius:9px;padding:10px;max-width:100%;margin:4px}#ranking{text-align:left;padding-left:30px}#ranking li{padding:8px;overflow-wrap:anywhere} </style><main><a href="index.html">← Retour au calendrier</a><h1>✧ La Guilde enchantée ✧</h1><p>25 jours de magie, de défis et de trésors.</p><section><div id="profile"></div><small>Pièces et trésors sur cet appareil</small><p><label for="nickname">Ton prénom ou pseudo</label></p><input id="nickname" maxlength="30" autocomplete="nickname" placeholder="Prénom ou pseudo"><button id="join">Enregistrer</button><p id="accountStatus" role="status"></p></section><section><h2 id="name"></h2><p id="desc"></p><label id="difficultyLabel">Difficulté : <select id="difficulty"><option value="0">Apprenti</option><option value="1">Enchanteur</option><option value="2">Légendaire</option></select></label><p></p><button id="start">Jouer</button><p id="status" aria-live="polite"></p><div id="board"></div></section><section><h2>Les défis de décembre</h2><div id="days"></div><p><small>Les défis se débloquent chaque jour, heure de Paris.</small></p></section><section><h2>🏅 Mes trésors</h2><p id="treasures"></p></section><section><h2>🏆 Classement de la Guilde</h2><p>Meilleurs scores quotidiens cumulés</p><ol id="ranking"></ol><button id="refreshRank">Actualiser</button><p id="rankStatus" role="status"></p></section></main><div id="spark"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), board=$('board');const games=[['Le Memory enchanté','Retrouve toutes les paires à ton rythme.'],['La pluie d’étoiles','Attrape les étoiles pendant 30 secondes.'],['Les runes magiques','Répète la suite de symboles.'],['Le coffre mystère','Trouve le coffre indiqué par les indices.'],['La chasse aux cristaux','Clique sur le symbole différent.'],['Les potions enchantées','Choisis la potion demandée le plus vite possible.'],['Les mots ensorcelés','Sélectionne la première et la dernière lettre de chaque mot caché.'],['Le labyrinthe enchanté','Guide la fée vers la sortie avec les flèches.'],['Les énigmes du grimoire','Trouve les bonnes réponses.'],['Le puzzle magique','Remets les chiffres dans l’ordre en déplaçant les cases.']];let data={coins:0,plays:0,best:0,treasures:[]};try{data={...data,...JSON.parse(localStorage.getItem('guilde2026')||'{}')}}catch{};let day=1,run=0,timer,delay,score=0;const parts=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());const get=t=>Number(parts.find(p=>p.type===t).value);const date=get('year')*10000+get('month')*100+get('day'), unlocked=date<20261201?0:date>20261225?25:get('day');const preview=!unlocked&&new URLSearchParams(location.search).get('test')==='1';day=unlocked||1;const icons=['🌙','⭐','💎','🧚','🍄','🔮','🗝️','🎄'];const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function profile(){$('profile').textContent=`🪙 ${data.coins} pièces • Niveau ${1+Math.floor(data.coins/100)} • Record ${data.best}`;$('treasures').textContent=data.treasures.join(' • ')||'Des secrets attendent d’être découverts…'}function reset(){run++;clearInterval(timer);clearTimeout(delay);board.replaceChildren();board.className='';board.style.gridTemplateColumns='';$('start').disabled=false;$('difficulty').disabled=false}function choose(d){reset();day=d;let g=games[(d-1)%games.length];$('difficultyLabel').hidden=![0,6,7].includes((d-1)%games.length);$('name').textContent=g[0];$('desc').textContent=g[1];$('status').textContent=unlocked?'Défi '+d:(preview?'Mode test — défi '+d+' sur 25, sans récompense':'Mode découverte avant le 1er décembre');$('start').textContent='Jouer'}function finish(s){const playedDay=day, playedLevel=Number($('difficulty').value);reset();if(unlocked){data.coins+=s;data.plays++;data.best=Math.max(data.best,s);if(data.plays===1)data.treasures.push('🌱 Apprenti');if(data.plays===5)data.treasures.push('🗝️ Clé secrète');if(Math.random()<.12&&!data.treasures.includes('🧚 Fée légendaire'))data.treasures.push('🧚 Fée légendaire');try{localStorage.setItem('guilde2026',JSON.stringify(data))}catch{}profile();saveScore(s,playedDay,playedLevel)}$('status').textContent=`Partie terminée : ${s} points${unlocked?' • +'+s+' pièces':' • essai sans récompense'}`;$('start').textContent='Rejouer'}function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;board.append(b);return b}function start(){reset();$('start').disabled=true;score=0;const level=Number($('difficulty').value);$('difficulty').disabled=true;let token=run,g=(day-1)%games.length;$('status').textContent='À toi de jouer !';if(g===0){const count=[8,12,18][level],symbols=[...icons,'🐉','🦉','🕯️','🎁','❄️','🍀','🦋','🏰','🍎','🔔'].slice(0,count);let cards=shuffle([...symbols,...symbols]),first=null,lock=false,pairs=0,moves=0,streak=0,bonus=0,begin=Date.now();board.className='memory';board.style.gridTemplateColumns=`repeat(${level===2?6:4},1fr)`;function info(){$('status').textContent=`${pairs}/${count} paires • ${moves} coups • ${Math.floor((Date.now()-begin)/1000)} s • Bonus ${bonus}`};info();timer=setInterval(info,500);cards.forEach(v=>{let b=btn('✦',()=>{if(lock||b.disabled||first?.b===b)return;b.textContent=v;if(!first){first={b,v};return}moves++;let a=first;first=null;if(a.v===v){a.b.disabled=b.disabled=true;streak++;if(streak>1)bonus+=5;if(++pairs===count){if(unlocked&&Math.random()<.12&&!data.treasures.includes('🎁 Coffre secret'))data.treasures.push('🎁 Coffre secret');return finish(Math.max(10,count*25-(moves-count)*3)+bonus)}}else{streak=0;lock=true;delay=setTimeout(()=>{a.b.textContent=b.textContent='✦';lock=false},650)}info()})})}else if(g===1){board.className='arcade';let end=Date.now()+30000;function spawn(){board.replaceChildren();let b=btn('⭐',()=>{score+=5;spawn()});b.style.left=Math.random()*75+'%';b.style.top=Math.random()*75+'%'}spawn();timer=setInterval(()=>{let left=Math.ceil((end-Date.now())/1000);if(left<=0)return finish(score);$('status').textContent=left+' s • '+score+' points'},150)}else if(g===2){let seq=[],pos=0;function round(){seq.push(icons[Math.floor(Math.random()*4)]);pos=0;board.replaceChildren();$('status').textContent=seq.join(' ');delay=setTimeout(()=>{if(token!==run)return;$('status').textContent='À toi de reproduire !';icons.slice(0,4).forEach(v=>btn(v,()=>{if(v!==seq[pos++])return finish(score);if(pos===seq.length){score+=10;round()}}))},1000+seq.length*300)}round()}else if(g===6){const n=[11,13,15][level],words=shuffle(['MAGIE','ETOILE','SAPIN','NEIGE','FEE','LUNE','RUNE','HIVER','DRAGON','COFFRE','POTION','FORET','CRISTAL','CADEAU']).slice(0,[5,8,12][level]),cells=Array(n*n).fill(''),paths=[];words.forEach((w,i)=>{let r=i,c=Math.floor(Math.random()*(n-w.length+1)),path=[];for(let j=0;j<w.length;j++){let k=r*n+c+j;cells[k]=w[j];path.push(k)}paths.push(path)});let first=null,found=new Set(),buttons=[];board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.className='letters';function info(){$('status').textContent='Mots : '+words.map((w,i)=>found.has(i)?'✓ '+w:w).join(' • ')}info();cells.forEach((v,k)=>{let b=btn(v||'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)],()=>{if(first===null){first=k;b.style.outline='2px solid gold';return}let i=paths.findIndex(p=>(p[0]===first&&p.at(-1)===k)||(p[0]===k&&p.at(-1)===first));buttons[first].style.outline='';first=null;if(i>=0&&!found.has(i)){found.add(i);paths[i].forEach(j=>buttons[j].style.background='#80652b');info();if(found.size===words.length)finish(100)}});buttons.push(b)})}else if(g===7){const n=[11,15,19][level],open=new Set([0]),seen=new Set([0]);function carve(k){for(const [dx,dy] of shuffle([[2,0],[-2,0],[0,2],[0,-2]])){let x=k%n+dx,y=Math.floor(k/n)+dy;if(x<0||y<0||x>=n||y>=n)continue;let j=y*n+x;if(seen.has(j))continue;seen.add(j);open.add(j);open.add((k+j)/2);carve(j)}}carve(0);let pos=0;board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.className='letters';let tiles=[];for(let k=0;k<n*n;k++){let b=btn('',()=>move(k));b.style.background=open.has(k)?'#315643':'#07150f';b.disabled=!open.has(k);tiles.push(b)}function paint(){tiles.forEach((b,k)=>b.textContent=k===pos?'🧚':k===n*n-1?'🏁':'')}function move(k){if(!open.has(k)||Math.abs(k%n-pos%n)+Math.abs(Math.floor(k/n)-Math.floor(pos/n))!==1)return;pos=k;paint();if(pos===n*n-1)finish(100)}paint();let controls=document.createElement('div');controls.style.gridColumn='1 / -1';for(let [t,d] of [['←',-1],['↑',-n],['↓',n],['→',1]]){let b=document.createElement('button');b.textContent=t;b.onclick=()=>move(pos+d);controls.append(b)}board.append(controls);$('status').textContent='Atteins le drapeau !'}else if(g===8){let qs=shuffle([['Je tombe sans me blesser et je fonds au soleil.',['Neige','Pierre','Étoile']],['Je brille la nuit et change de forme.',['Lune','Sapin','Clé']],['Je possède des dents mais ne mords pas.',['Peigne','Dragon','Coffre']],['Plus je sèche, plus je deviens mouillée.',['Serviette','Bougie','Rune']]]),i=0;function next(){if(i===qs.length)return finish(score);board.replaceChildren();let [q,a]=qs[i++];$('status').textContent=q;shuffle(a).forEach(v=>btn(v,()=>{if(v===a[0])score+=25;next()}))}next()}else if(g===9){let a=[1,2,3,4,5,6,7,8,0];function neighbors(k){return a.map((_,j)=>j).filter(j=>Math.abs(j%3-k%3)+Math.abs(Math.floor(j/3)-Math.floor(k/3))===1)}for(let i=0;i<60;i++){let k=a.indexOf(0),j=shuffle(neighbors(k))[0];[a[k],a[j]]=[a[j],a[k]]}board.style.gridTemplateColumns='repeat(3,1fr)';function paint(){board.replaceChildren();a.forEach((v,j)=>btn(v||' ',()=>{let k=a.indexOf(0);if(!neighbors(k).includes(j))return;[a[k],a[j]]=[a[j],a[k]];if(a.join(',')==='1,2,3,4,5,6,7,8,0')finish(100);else paint()}))}paint()}else{let rounds=0;function round(){if(rounds++===10)return finish(score);board.replaceChildren();let target=icons[Math.floor(Math.random()*icons.length)],other=icons.find(x=>x!==target);$('status').textContent=g===3?'Le trésor porte le signe '+target:g===4?'Trouve le symbole différent !':'Potion demandée : '+target;let choices=g===4?shuffle([target,...Array(11).fill(other)]):shuffle([target,...shuffle(icons.filter(x=>x!==target)).slice(0,7)]);choices.forEach(v=>btn(g===3?'🎁 '+v:v,()=>{if(v===target)score+=10;round()}))}round()}}$('start').onclick=start;for(let i=1;i<=25;i++){let b=document.createElement('button');b.textContent=i<=unlocked||preview||(!unlocked&&i===1)?i:'🔒 '+i;b.disabled=!preview&&i>unlocked&&!(!unlocked&&i===1);b.onclick=()=>choose(i);$('days').append(b)}profile();choose(day);

const guildClient=window.supabase?.createClient('https://sjrohgtzoljsyhoswrqw.supabase.co','sb_publishable_pJgjRdy-Q_lA7IjlXULXyA_GgPxYP88',{auth:{storageKey:'guilde-enchantee-auth-v1',detectSessionInUrl:false}});
let player=null,busy=false;
async function loadPlayer(){if(!guildClient)return;const {data:{session}}=await guildClient.auth.getSession();if(!session)return;const {data,error}=await guildClient.from('guilde_joueurs').select('id,pseudo').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(data){player=data;$('nickname').value=data.pseudo;$('accountStatus').textContent='Bienvenue, '+data.pseudo+' !'}}
$('join').onclick=async()=>{if(busy)return;const pseudo=$('nickname').value.trim();if(pseudo.length<2||pseudo.length>30){$('accountStatus').textContent='Choisis un nom de 2 à 30 caractères.';return}busy=true;$('join').disabled=true;try{if(!guildClient)throw Error('Connexion indisponible');let {data:{session}}=await guildClient.auth.getSession();if(!session){const r=await guildClient.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}if(!session)throw Error('Session indisponible');const r=await guildClient.from('guilde_joueurs').upsert({user_id:session.user.id,pseudo},{onConflict:'user_id'}).select('id,pseudo').single();if(r.error)throw r.error;player=r.data;$('accountStatus').textContent='Bienvenue, '+player.pseudo+' !';refreshRank()}catch(e){$('accountStatus').textContent='Impossible de sauvegarder le profil. Réessaie.';console.error(e)}finally{busy=false;$('join').disabled=false}};
async function refreshRank(){try{if(!guildClient)throw Error('Connexion indisponible');const {data,error}=await guildClient.rpc('guilde_classement');if(error)throw error;$('ranking').replaceChildren();for(const r of data){const li=document.createElement('li');li.textContent=r.pseudo+' — '+r.points+' pts';$('ranking').append(li)}$('rankStatus').textContent=data.length?'':'Aucun score pour le moment.'}catch(e){$('rankStatus').textContent='Classement indisponible. Réessaie.';console.error(e)}}
async function saveScore(s,d,l){if(!player){$('accountStatus').textContent='Enregistre ton prénom ou pseudo avant ta prochaine partie pour rejoindre le classement.';return}if(!unlocked)return;try{const {error}=await guildClient.from('guilde_scores').insert({joueur_id:player.id,jeu:'defi-'+d,score:Math.min(3000,Math.max(0,Math.floor(s)))});if(error)throw error;$('accountStatus').textContent='Score enregistré !';refreshRank()}catch(e){$('accountStatus').textContent='Score non enregistré. Vérifie ta connexion.';console.error(e)}}
$('refreshRank').onclick=refreshRank;loadPlayer().catch(()=>{$('accountStatus').textContent='Profil indisponible.'});refreshRank();
