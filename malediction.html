<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Malédiction du Grimoire</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38204d,#100b19 65%);color:#e9d9bd;font:17px Georgia,serif;min-height:100vh}main{max-width:850px;margin:auto;padding:30px 16px;text-align:center}h1{font-size:clamp(28px,6vw,48px);color:#e0bcff;text-shadow:0 0 24px #a45cff}small{letter-spacing:3px;color:#c5a46b}section{border:1px solid #94764e;border-radius:18px;padding:20px 12px;background:#17101f;box-shadow:0 0 45px #7e38a333}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:24px 0}button{font:inherit;color:#93839e;background:linear-gradient(145deg,#392b46,#191421);border:1px solid #685273;border-radius:14px 8px 18px 9px;min-height:78px;cursor:pointer}button span{display:block;font-size:30px}button.active{color:#f0caff;border-color:#c68aff;box-shadow:0 0 18px #a04aff88}a{color:#d9b67b}#clock{font-size:clamp(20px,5vw,32px);color:#d8aaff}dialog{background:#21152e;color:#e9d9bd;border:1px solid #b39361;border-radius:16px;max-width:90vw;padding:24px}dialog::backdrop{background:#08050bd9}dialog button{min-height:40px;padding:8px 20px}</style><main><small>LES CHRONIQUES DU ROYAUME</small><h1>La Malédiction du Grimoire</h1><p>Quinze sceaux. Quinze épreuves. Une seule malédiction à briser.</p><section><p id="status">Le grimoire sommeille encore.</p><div id="clock"></div><div class="grid" id="stones"></div><p>Les ombres gardent leurs secrets.</p><p id="preview" hidden>Mode aperçu — aucune récompense ni progression réelle.</p></section><p><a href="guilde.html">Retour à la Guilde</a></p></main><dialog id="modal"><h2 id="heading"></h2><p id="message"></p><button onclick="this.closest('dialog').close()">Fermer</button></dialog><script>const test=new URLSearchParams(location.search).get('test')==='1';const names=['L’alphabet oublié','Le miroir des ombres','Les symboles menteurs','La lettre invisible','Le labyrinthe des mots','Les trois gardiens','Le message fragmenté','L’horloge maudite','Le portrait silencieux','Le chant des runes','La bibliothèque interdite','Le pacte des ombres','La prophétie brisée','Le dernier sacrifice','L’ultime malédiction'];const symbols=[...'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉ'];document.getElementById('preview').hidden=!test;names.forEach((n,i)=>{const b=document.createElement('button');b.innerHTML='<span>'+symbols[i]+'</span>'+String(i+1).padStart(2,'0');if(test&&i===0)b.classList.add('active');b.onclick=()=>{document.getElementById('heading').textContent=test?n:'Sceau '+(i+1);document.getElementById('message').textContent=test?'Aperçu du sceau. Énigme et validation serveur à intégrer.':'Ce sceau est scellé.';document.getElementById('modal').showModal()};document.getElementById('stones').append(b)});function tick(){let t=Math.max(0,Date.parse('2026-12-01T00:00:00+01:00')-Date.now());let s=Math.floor(t/1000);document.getElementById('clock').textContent=t?Math.floor(s/86400)+'j '+Math.floor(s%86400/3600)+'h '+Math.floor(s%3600/60)+'m '+s%60+'s':'Le grimoire attend son activation.'}tick();setInterval(tick,1000)</script></html>
