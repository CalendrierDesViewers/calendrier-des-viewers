r.net/npm/@supabase/supabase-js@2"></script><main><a id="back" href="guilde.html">← Retour à la Guilde</a><p>✧ ─── ᛟ ─── ✧</p><h1>Le Sanctuaire oublié</h1><p>Quinze secrets. Un seul héritier.</p><section><p>Les pierres anciennes attendent les mots perdus du Royaume.</p><div class="runes" id="runes"></div><p id="count"></p><form id="form"><input id="word" placeholder="Inscrire un mot secret…" required maxlength="80" autocomplete="off"><button>Sceller la rune</button></form><p id="status" role="status"></p><div id="final" hidden><h2>L’ultime énigme</h2><p>Lis les initiales des quinze mots dans l’ordre des runes, puis inscris la suite de lettres sans espace.</p><form id="finish"><input id="phrase" required placeholder="Formule secrète"><button>Ouvrir le trésor</button></form></div><small id="note"></small></section></main><script>const $=id=>document.getElementById(id),test=new URLSearchParams(location.search).get('test')==='1';let client,found=[];const glyphs='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉ';function render(){$('runes').innerHTML=Array.from({length:15},(_,i)=>'<div class="rune '+(found.includes(i)?'on':'')+'">'+(found.includes(i)?glyphs[i]:i+1)+'</div>').join('');$('count').textContent=found.length+' / 15 runes découvertes';$('final').hidden=found.length!==15}render();if(test){$('back').href='guilde.html?test=1';$('note').textContent='Mode démonstration : saisir TEST1 à TEST15. Aucun gain réel.'}else{try{client=window.supabase.createClient('https://sjrohgtzoljsyhoswrqw.supabase.co','sb_publishable_pJgjRdy-Q_lA7IjlXULXyA_GgPxYP88',{auth:{storageKey:'guilde-enchantee-auth-v1',detectSessionInUrl:false}});client.rpc('sanctuaire_etat').then(({data,error})=>{if(!error&&data){found=data.runes.map(n=>n-1);render()}})}catch(e){$('status').textContent='Connexion indisponible.'}}$('form').onsubmit=async e=>{e.preventDefault();try{if(test){let m=/^test([1-9]|1[0-5])$/i.exec($('word').value.trim());if(!m){$('status').textContent='La pierre reste silencieuse.';return}let i=+m[1]-1;if(!found.includes(i))found.push(i)}else{const {data,error}=await client.rpc('sanctuaire_valider',{p_mot:$('word').value});if(error)throw error;if(!data.correct){$('status').textContent=data.limite?'Patiente une minute.':'La pierre reste silencieuse.';return}found=data.runes.map(n=>n-1)}render();$('status').textContent='La rune résonne !';$('word').value=''}catch(e){$('status').textContent='Connexion à la Guilde nécessaire.'}};$('finish').onsubmit=async e=>{e.preventDefault();if(test){$('status').textContent='Démonstration uniquement : aucun trésor attribué.';return}try{const {data,error}=await client.rpc('sanctuaire_terminer',{p_formule:$('phrase').value});if(error)throw error;$('status').textContent=({gagnant:'Tu es le Gardien du Secret ! 5 000 pièces gagnées.',tresor_deja_remporte:'Le trésor a déjà été remporté.',limite:'Patiente une minute.',formule_incorrecte:'Le sceau reste fermé.',runes_manquantes:'Il manque des runes.'})[data.statut]||'Le sceau reste fermé.'}catch(e){$('status').textContent='Impossible de valider.'}};</script></html>
