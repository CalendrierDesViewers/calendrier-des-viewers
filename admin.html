<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration du royaume</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#49382b,#102820 70%);color:#f5e5c4;font:16px Georgia,serif;min-height:100vh}main{max-width:950px;margin:auto;padding:20px}h1,h2{color:#e9c77e}section{background:#182c25;border:1px solid #bda05e;border-radius:12px;padding:18px;margin:14px 0}input,button,select{font:inherit;padding:12px;border:1px solid #bda05e;border-radius:8px;background:#243b30;color:#ffe2a0;max-width:100%}input{width:100%;margin:5px 0}button{cursor:pointer;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-bottom:1px solid #806b42;padding:12px 0}small{color:#d9bd87}a{color:#ffe2a0}</style><main><h1>✦ Conseil du royaume</h1><p>Administration privée</p><section id="login"><form id="form"><label>Adresse e-mail<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button>Connexion</button></form></section><p id="status" role="status"></p><section id="panel" hidden><button id="calendar">🎄 Calendrier</button><button id="realm">🏰 Royaume</button><button id="logout">Déconnexion</button><h2 id="heading"></h2><div id="actions"></div><div id="results"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const $=id=>document.getElementById(id),client=window.supabase.createClient('https://sjrohgtzoljsyhoswrqw.supabase.co','sb_publishable_pJgjRdy-Q_lA7IjlXULXyA_GgPxYP88',{auth:{storageKey:'royal-admin-auth-v1',detectSessionInUrl:false}});async function rpc(name,args={}){const r=await client.rpc(name,args);if(r.error)throw r.error;return r.data}function status(s){$('status').textContent=s}async function open(){try{if(await rpc('royal_admin_allowed')!==true)throw Error('Accès administrateur refusé');$('login').hidden=true;$('panel').hidden=false;status('Connexion administrateur active');show('realm')}catch(e){$('panel').hidden=true;$('login').hidden=false;status(e.message)}}$('form').onsubmit=async e=>{e.preventDefault();try{const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)throw r.error;await open()}catch(e){status(e.message)}};$('logout').onclick=async()=>{await client.auth.signOut();$('panel').hidden=true;$('results').replaceChildren();$('login').hidden=false;status('Déconnecté')};async function show(kind){$('heading').textContent=kind==='realm'?'Gestion du royaume':'Gestion du calendrier';$('actions').replaceChildren();$('results').replaceChildren();const types=kind==='realm'?[['guilde_joueurs','Joueurs'],['guilde_boutique','Boutique']]:[['participations','Participants'],['draws','Gagnants'],['advent_days','Cadeaux']];for(const [table,label] of types){const b=document.createElement('button');b.textContent=label;b.onclick=()=>load(table);$('actions').append(b)}await load(types[0][0])}async function load(table){try{const rows=await rpc('royal_admin_list',{p_table:table});$('results').replaceChildren();for(const row of rows||[]){const a=document.createElement('article'),p=document.createElement('pre');p.textContent=JSON.stringify(row,null,2);a.append(p);if(table==='guilde_joueurs'){const b=document.createElement('button');b.textContent='Ajuster les pièces';b.onclick=async()=>{const raw=prompt('Nombre de pièces à ajouter ou retirer (ex. -100)');if(raw===null||!/^[-+]?\d+$/.test(raw))return;const delta=Number(raw);if(!Number.isSafeInteger(delta)||!confirm('Confirmer la modification de '+delta+' pièces ?'))return;try{await rpc('royal_admin_coins',{p_id:row.id,p_delta:delta});await load(table)}catch(e){status(e.message)}};a.append(b)}$('results').append(a)}if(!rows?.length)$('results').textContent='Aucun résultat';}catch(e){status(e.message)}}$('calendar').onclick=()=>show('calendar');$('realm').onclick=()=>show('realm');client.auth.getSession().then(r=>{if(r.data.session)open()});</script></html>
