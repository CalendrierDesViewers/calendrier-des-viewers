<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration • Royaume test</title><style>*{box-sizing:border-box}body{margin:0;background:#0c211d;color:#f5e8cb;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}h1,h2{font-family:Georgia;color:#e6c582}header,article,.stat{border:1px solid #927545;border-radius:15px;background:#17332b;padding:16px}header{text-align:center}small{color:#c7c6ae}button,input,select{font:inherit;border:1px solid #a88b50;border-radius:8px;padding:10px;background:#10271f;color:#f5e8cb}button{cursor:pointer;background:#59492b}button:active{background:#826637}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat strong{display:block;font-size:25px;color:#e6c582}.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input{min-width:0;flex:1}article{margin:12px 0}.profile{display:flex;gap:14px;align-items:center}img{width:64px;height:76px;object-fit:cover;border-radius:10px}h3{margin:0}progress{width:100%;accent-color:#b9c98b}a{color:#e6c582}#notice{min-height:24px;color:#d5e6a9}</style><main><header><small>✦ LE CALENDRIER DES VIEWERS ✦</small><h1>Administration du Royaume</h1><p>Mode test — données fictives uniquement</p><small>Aucune connexion à Supabase. Aucun joueur réel modifié.</small></header><div class="stats" id="stats"></div><h2>Registre des aventuriers</h2><div class="tools"><input id="search" placeholder="Rechercher un pseudo"><select id="sort"><option value="name">Pseudo</option><option value="coins">Pièces</option><option value="days">Progression</option></select><button id="reset">Réinitialiser</button></div><div id="notice" role="status"></div><div id="players"></div><p><a href="admin.html">Administration réelle</a></p></main><script>const initial=[{name:'LuneMystique',hero:'Élora',img:'elora.png',coins:3250,days:8,cards:5},{name:'DragonNoir',hero:'Kael',img:'kael.png',coins:7800,days:15,cards:12},{name:'NoxGaming',hero:'Raven',img:'raven.png',coins:1200,days:3,cards:2},{name:'FéeDesBois',hero:'Lyra',img:'lyra.png',coins:4600,days:12,cards:8},{name:'OrionTV',hero:'Orion',img:'orion.png',coins:0,days:0,cards:0}];let data=structuredClone(initial);const $=id=>document.getElementById(id);function render(){ $('stats').innerHTML='<div class="stat">Joueurs fictifs<strong>'+data.length+'</strong></div><div class="stat">Pièces en circulation<strong>'+data.reduce((a,p)=>a+p.coins,0).toLocaleString('fr-FR')+'</strong></div>';let list=data.filter(p=>p.name.toLowerCase().includes($('search').value.toLowerCase())).sort((a,b)=>$('sort').value==='name'?a.name.localeCompare(b.name):b[$('sort').value]-a[$('sort').value]);$('players').innerHTML=list.map(p=>'<article><div class="profile"><img src="'+p.img+'" alt=""><div><h3>'+p.name+'</h3><small>'+p.hero+'</small><p>🪙 '+p.coins.toLocaleString('fr-FR')+' pièces · '+p.cards+' cartes</p></div></div><small>Défis validés : '+p.days+'/25</small><progress max="25" value="'+p.days+'"></progress><div class="actions"><button onclick="change('+data.indexOf(p)+',100)">+100 pièces</button><button onclick="change('+data.indexOf(p)+',-100)">−100 pièces</button><button onclick="custom('+data.indexOf(p)+')">Autre montant</button></div></article>').join('')||'<p>Aucun joueur trouvé.</p>'}function change(i,n){data[i].coins=Math.max(0,data[i].coins+n);$('notice').textContent='Solde test modifié : '+data[i].name;render()}function custom(i){let v=prompt('Montant à ajouter ou retirer (ex. -500)');if(v!==null&&v.trim()&&Number.isSafeInteger(Number(v))&&Math.abs(Number(v))<=1000000)change(i,Number(v))}$('search').oninput=render;$('sort').onchange=render;$('reset').onclick=()=>{data=structuredClone(initial);$('notice').textContent='Données fictives réinitialisées.';render()};render()</script></html>
