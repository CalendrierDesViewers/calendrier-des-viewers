<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marché enchanté</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#56302e,#102820 65%);color:#f5e5c4;font:16px Georgia,serif;min-height:100vh}main{max-width:900px;margin:auto;padding:18px}h1,h2{text-align:center;color:#e9c77e}nav{text-align:center}a,button{color:#ffe2a0}button{font:inherit;background:#354638;border:1px solid #bda05e;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.5}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.item{border:2px solid var(--rarity);border-radius:12px;background:#182c25;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}.symbol{font-size:42px;color:var(--rarity);height:60px}.locked .symbol{opacity:.25}.item small{color:var(--rarity)}#tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#balance,#status,#progress{text-align:center}progress{width:100%;accent-color:#c9a35e}</style><style>#royaumeNav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 8px;background:#172c25;border-bottom:1px solid #bda05e;color:#f5e5c4;font:14px Georgia,serif}#royaumeNav a{color:#ffe2a0;padding:8px;border:1px solid #806b42;border-radius:8px;text-decoration:none;touch-action:manipulation}#royaumeNav a[aria-current]{background:#80602e}#royaumeProfile{flex-basis:100%;text-align:center}</style><nav id="royaumeNav" aria-label="Navigation du royaume"><span id="royaumeProfile"></span></nav><script>(()=>{const nav=document.getElementById('royaumeNav'),test=new URLSearchParams(location.search).get('test')==='1';for(const [file,label,hash] of [["guilde.html","Accueil",""],["defis.html","Défis",""],["arcade.html","Arcade",""],["marche.html","Marché",""],["tresors.html","Trésors",""],["album.html","Album",""],["grimoire.html","Grimoire",""],["garderobe.html","Garde-robe",""],["classement.html","Classement",""]]){let a=document.createElement('a');a.href=file+(test?'?test=1':'')+hash;a.textContent=label;if(location.pathname.endsWith(file)&&!hash)a.setAttribute('aria-current','page');nav.append(a)}function refresh(){try{let d=JSON.parse(localStorage.getItem('guilde2026')||'{}'),p=JSON.parse(localStorage.getItem('guilde-avatar-v1')||'null');document.getElementById('royaumeProfile').textContent=(p?.name||'Voyageur')+' • '+(test?'Mode test':(d.coins||0)+' pièces')}catch{}}refresh();window.addEventListener('pageshow',refresh);window.addEventListener('storage',refresh);document.addEventListener('click',()=>setTimeout(refresh,0))})();</script><main><nav><a id="back" href="guilde.html">← Guilde</a> · <a id="other"></a></nav><h1 id="heading"></h1><p id="balance"></p><div id="tabs"></div><p id="progress"></p><p id="status" aria-live="polite"></p><div id="items"></div></main><script>const groups=[["Familiers magiques","🐾",["Renard polaire","Chouette des neiges","Lièvre blanc","Chat du solstice","Cerf argenté","Loup enchanté","Hermine royale","Corbeau de givre","Griffon des neiges","Dragon de givre","Phénix du solstice","Licorne boréale"]],["Reliques légendaires","⚜",["Clé de cuivre","Cloche ancienne","Rune de houx","Anneau de neige","Plume argentée","Amulette du pin","Grimoire d’hiver","Dague de cristal","Lanterne éternelle","Sceptre de givre","Calice étoilé","Bouclier du cerf","Boussole enchantée","Épée du solstice","Couronne de glace","Orbe boréale","Miroir des songes","Cœur du dragon","Couronne des étoiles","Flamme éternelle"]],["Tenues enchantées","♛",["Reine du givre","Chevalier de Noël","Elfe des neiges","Gardien de la forêt","Enchanteresse de Noël","Seigneur des dragons","Guerrière du solstice","Chevalier de glace","Souveraine de Noël","Archer boréal","Mage des étoiles","Dame du houx","Roi de l’hiver","Sentinelle lunaire","Impératrice des aurores"]],["Boules à neige","❄",["Village du houx","Forêt blanche","Chalet des étoiles","Lac gelé","Tour du guet","Abbaye enneigée","Port du nord","Château de cristal","Royaume des dragons","Palais des aurores"]]],$=id=>document.getElementById(id),q=new URLSearchParams(location.search),test=q.get('test')==='1',museum=location.pathname.endsWith('tresors.html'),key='guilde2026',demoKey='guilde-market-demo-v1',prices=[250,500,1200,2500,5000],rarities=['Commune','Rare','Épique','Légendaire','Mythique'],colors=['#a9b0a8','#75b8ef','#c58af0','#e9bf62','#f18080'];let category=0;const parts=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),num=k=>Number(parts.find(x=>x.type===k).value),day=num('day'),active=num('year')===2026&&num('month')===12&&day<=25;function read(){try{return JSON.parse((test?sessionStorage:localStorage).getItem(test?demoKey:key)||'null')||{coins:test?5000:0}}catch{return {coins:test?5000:0}}}function save(d){(test?sessionStorage:localStorage).setItem(test?demoKey:key,JSON.stringify(d))}function owned(d,g,i){return g===2&&i<6||g===2&&i<9&&d.ownedSkins?.includes(i)||d.collection?.includes(g+'-'+i)}function rarity(g,i){if(g===2&&i<9)return i<6?0:i-5;return Math.min(4,Math.floor(i/groups[g][2].length*5))}function draw(){let d=read(),total=groups.reduce((s,g,j)=>s+g[2].filter((_,i)=>owned(d,j,i)).length,0),g=groups[category];$('balance').textContent=(d.coins||0)+' pièces'+(test?' fictives':'');$('progress').textContent=g[0]+' : '+g[2].filter((_,i)=>owned(d,category,i)).length+'/'+g[2].length+' • Total '+total+'/57';$('items').replaceChildren();g[2].forEach((name,i)=>{let have=owned(d,category,i),r=rarity(category,i),available=category===2&&i<9||((i+day)%g[2].length)<Math.ceil(g[2].length/2);if(!museum&&!available&&!have)return;let card=document.createElement('article');card.className='item'+(museum&&!have?' locked':'');card.style.setProperty('--rarity',colors[r]);let symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=museum&&!have?'?':g[1];let label=document.createElement('strong');label.textContent=(i+1)+'. '+(museum&&!have?'Objet mystérieux':name);let info=document.createElement('small');info.textContent=rarities[r];card.append(symbol,label,info);let b=document.createElement('button');b.textContent=have?'Collectionné':museum?'À découvrir':prices[r]+' pièces';b.disabled=have||museum||(!test&&!active)||(d.coins||0)<prices[r];b.onclick=()=>{let fresh=read();if(owned(fresh,category,i)||(fresh.coins||0)<prices[r]||(!test&&!active))return;fresh.coins-=prices[r];(fresh.collection??=[]).push(category+'-'+i);if(category===2&&i>=6&&i<9)(fresh.ownedSkins??=[]).push(i);try{save(fresh);$('status').textContent='Objet ajouté : '+name;draw()}catch{$('status').textContent='Sauvegarde impossible'}};card.append(b);$('items').append(card)})}groups.forEach((g,i)=>{let b=document.createElement('button');b.textContent=g[0];b.onclick=()=>{category=i;draw()};$('tabs').append(b)});$('heading').textContent=museum?'La salle des trésors':'Le marché enchanté';$('other').textContent=museum?'Marché enchanté':'Salle des trésors';$('other').href=(museum?'marche.html':'tresors.html')+(test?'?test=1':'');if(test)$('back').href+='?test=1';draw();</script></html>
